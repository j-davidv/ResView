name: PRC publication monitor

on:
  workflow_dispatch:
    inputs:
      live:
        description: Fetch public PRC sources and update Firebase
        type: boolean
        default: false
      review_documents:
        description: Retrieve permitted originals encrypted for independent review (no activation)
        type: boolean
        default: false
  schedule:
    - cron: '57 * * * *'
  push:
    paths: ['worker/**', '.github/workflows/monitor.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/monitor.yml']

permissions:
  contents: read

concurrency:
  group: prc-publication-monitor
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt
      - run: python -m unittest discover -s worker/tests -v

  monitor:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.live || inputs.review_documents)) ||
       (github.event_name == 'schedule' && vars.PRC_MONITOR_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require worker identity configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_WORKER_SERVICE_ACCOUNT }}
        run: test -n "$PROVIDER" && test -n "$ACCOUNT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKER_SERVICE_ACCOUNT }}
      - run: pip install -r worker/requirements.txt
      - name: Scan public publications with delivery disabled
        if: github.event_name != 'workflow_dispatch' || inputs.live
        env:
          FIREBASE_PROJECT_ID: resview-9240c
          SUPABASE_STORAGE_HOST: erlnuyltaudetjpriosu.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRC_PRIVATE_PROFILES: ${{ secrets.PRC_PRIVATE_PROFILES }}
        run: python -m worker.main --config worker/config.json --live-sources --delivery disabled
      - name: Record document review backlog
        if: always() && steps.auth.outcome == 'success'
        env:
          FIREBASE_PROJECT_ID: resview-9240c
          PRC_REVIEW_CERTIFICATE: ${{ vars.PRC_REVIEW_CERTIFICATE }}
          ACQUIRE: ${{ github.event_name == 'workflow_dispatch' && inputs.review_documents }}
        run: |
          args=()
          if [ "$ACQUIRE" = true ]; then args+=(--acquire); fi
          python -m worker.review --config worker/config.json --output runtime/review "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.auth.outcome == 'success'
        with:
          name: document-review
          path: |
            runtime/review/coverage.json
            runtime/review/*.pdf.cms
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose public source connectivity after failure
        if: failure()
        run: |
          python - <<'PY'
          import ipaddress
          import os
          import socket
          from worker.source import _request
          print('Proxy environment present:', any(os.environ.get(k) for k in ('HTTPS_PROXY', 'HTTP_PROXY', 'ALL_PROXY')))
          for host in ('www.prc.gov.ph', 'prc.gov.ph'):
              addresses = sorted({r[4][0] for r in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)})
              print(host, 'public DNS:', addresses)
              for address in addresses:
                  if not ipaddress.ip_address(address).is_global:
                      continue
                  try:
                      status, _, _ = _request('https://' + host + '/robots.txt', address, 262144, 10)
                      print(host, address, 'HTTP', status)
                  except Exception as error:
                      print(host, address, type(error).__name__)
          PY
