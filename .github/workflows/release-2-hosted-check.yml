name: Release 2 PRC hosted dry run
on:
  push:
    branches: [release-2-hosted-check]
    paths: [.github/workflows/release-2-hosted-check.yml, 'worker/**']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt
      - run: python -m unittest worker.tests.test_exam_history -v
      - name: Scan the PRC archives from Supabase without publishing
        env:
          PRC_ARCHIVE_TOKEN: ${{ secrets.PRC_ARCHIVE_TOKEN }}
        run: python -m worker.exam_history --hosted-source --cache runtime/history-cache
